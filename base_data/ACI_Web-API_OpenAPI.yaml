                    - CALLCENTER

                    - OPERATOR'
                  example: CALLCENTER_RESTRICTED
                kind:
                  type: string
                  description: 'The kind of the created contact. Could be:

                    - SEND

                    - SYSTEM

                    - SUPPORT

                    - MOTO

                    - WEB_API

                    - OAUTH_APP'
                  example: SEND
                language:
                  type: string
                  description: 'The contact language should be a two-letter code.
                    The available values are:

                    - en (English)

                    - de (German)

                    - fr (French)

                    - es (Spanish)

                    - it (Italian)

                    - ru (Russian)

                    - pt (Portuguese)

                    - nl (Nederlands)

                    - cn (Chinese)'
                  example: en
                mobile:
                  type: string
                  description: The mobile phone number
                autoAttach:
                  type: boolean
                  description: Automatically attach the user to the same entity.
                  example: 'true'
                description:
                  type: string
                  description: The contact description
                  example: daily operations
                  pattern: ^[A-Za-z0-9 _-]*$
                  x-enriched-from: 48741082.html
                  maxLength: 32
                oauthRedirectUrl:
                  type: string
                  description: Required for OAUTH kind contacts (BIP, developer portal,
                    virtual terminal)
                  example: '{{oauthUrl}}/{{pspName}}_oauthlogin.link'
                sendCredentialsMail:
                  type: boolean
                  description: Send an email upon contact creation.
                  example: 'true'
                sendAuthenticatorMail:
                  type: boolean
                  description: Send authenticator email upon contact creation.
                  example: 'true'
              type: object
              required:
              - name
              x-enriched-from: 48741082.html
            examples:
              Add Contact (PSP level):
                value:
                  autoAttach: 'true'
                  description: daily operations
                  email: callcenter_restricted{{email}}
                  kind: SEND
                  language: en
                  mobile: ''
                  name: Call Center Restricted
                  oauthRedirectUrl: '{{oauthUrl}}/{{pspName}}_oauthlogin.link'
