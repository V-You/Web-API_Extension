openapi: 3.0.3
info:
  title: ACI Merchant Onboarding API
  description: "Configure your entities and merchant accounts so that you are ready\
    \ to process.\n\n## Hosts\n\n- UAT: [<u>https://eu-test.oppwa.com/bip/webapi/v1</u>](https://eu-test.oppwa.com/bip/webapi/v1)\n\
    - LIVE: [<u>https://eu-prod.oppwa.com/bip/webapi/v1</u>](https://eu-prod.oppwa.com/bip/webapi/v1)\n\
    \    \n\n## Authentication\n\nYou require to create a WEB_API administrator user\
    \ in BIP and set it as ACTIVE for processing onboarding requests.\n\n- The user\
    \ must provide valid API key with every request.\n- The API key would be sent\
    \ as an authorization header with key=credentials, and value=username:password.\n\
    \    \n\nEach request to the onboarding API would contain three headers:\n\n\\\
    -h \"Accept: application/json\"  \n\\-h \"credentials: username:password\"  \n\
    \\-h \"Content-Type: application/x-www-form-urlencoded\"\n\n### Authentication\
    \ error response\n\nIf an API key is missing, malformed or invalid, you will receive\
    \ the following response code.\n\n{\"error\": {\"message\": \"Unauthorized - Invalid\
    \ credentials\"}}\n\n## Rate and usage limits\n\nWhen creating , deleting or changing\
    \ an entity or configuration in BIP via the onboarding API you require to wait\
    \ for a couple of seconds up to 3 minutes so that the change is reflected accordingly\
    \ before processing. The reason for the waiting period is due to a caching mechanism\
    \ activated to speed up transaction processing when handling all the configuration\
    \ performed by the customer.\n\n## Versioning\n\nThe API version is indicated\
    \ in the request URL, in `/webapi/v1/` it is version 1."
  version: 1.0.0
servers:
- url: https://eu-test.oppwa.com/bip/webapi/v1
- url: https://eu-prod.oppwa.com/bip/webapi/v1
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: credentials
      in: header
  schemas:
    ApiTokenId:
      type: string
      minLength: 32
      maxLength: 32
      pattern: ^[a-f0-9]{32}$
      description: The ID of the API token.
    ApiTokenAlias:
      type: string
      maxLength: 40
      pattern: ^[A-Za-z0-9_-]*$
      description: The alias or display name of the API token.
    ApiTokenState:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - DELETED
      description: Current state of the API token.
    ApiTokenTimestamp:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
      description: Timestamp in the legacy Web API format `YYYY-MM-DD HH:mm:ss`.
    ApiTokenLastDigits:
      type: string
      minLength: 6
      maxLength: 6
      pattern: ^[A-Za-z0-9+/]{5}=$
      description: Last six visible characters of the API token, including the trailing
        base64 padding character.
    ApiBearerToken:
      type: string
      format: byte
      pattern: ^[A-Za-z0-9+/]+={0,2}$
      description: Base64-encoded API bearer token returned when a token is created.
    ApiToken:
      type: object
      required:
      - id
      - alias
      - createdTime
      - lastDigits
      - lastUsedTime
      - state
      properties:
        id:
          $ref: '#/components/schemas/ApiTokenId'
        alias:
          $ref: '#/components/schemas/ApiTokenAlias'
        createdTime:
          $ref: '#/components/schemas/ApiTokenTimestamp'
        lastDigits:
          $ref: '#/components/schemas/ApiTokenLastDigits'
        lastUsedTime:
          $ref: '#/components/schemas/ApiTokenTimestamp'
        state:
          $ref: '#/components/schemas/ApiTokenState'
    ApiTokenWithBearer:
      allOf:
      - $ref: '#/components/schemas/ApiToken'
      - type: object
        required:
        - apiBearerToken
        properties:
          apiBearerToken:
            $ref: '#/components/schemas/ApiBearerToken'
    ApiTokenListResponse:
      type: object
      required:
      - apiTokens
      properties:
        apiTokens:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
    ApiTokenResponse:
      type: object
      required:
      - apiToken
      properties:
        apiToken:
          $ref: '#/components/schemas/ApiToken'
    ApiTokenCreatedResponse:
      type: object
      required:
      - apiToken
      properties:
        apiToken:
          $ref: '#/components/schemas/ApiTokenWithBearer'
      x-live-validation:
        status: 201
        apiBearerTokenReturned: true
    ApiTokenDeleteResponse:
      type: object
      maxProperties: 0
      description: Empty JSON object returned after successful deletion.
      example: {}
      x-live-validation:
        status: 200
    ApiTokenError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          properties:
            code:
              type: string
              description: Optional legacy application error code.
            message:
              type: string
              description: Error message returned by the Web API.
      example:
        error:
          message: Unauthorized - Invalid credentials
    UpdateApiTokenRequest:
      type: object
      required:
      - alias
      properties:
        alias:
          $ref: '#/components/schemas/ApiTokenAlias'
  parameters:
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: The merchant identifier.
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: ^[a-f0-9]{32}$
        description: The ID of the merchant.
        x-enriched-from: 01-Get-API-Token-List-for-Merchant_222692434.html
    ApiTokenIdPath:
      name: apiTokenId
      in: path
      required: true
      description: The ID of the API token.
      schema:
        $ref: '#/components/schemas/ApiTokenId'
security:
- apiKey: []
tags:
- name: Contacts
  description: Manage your contacts, type of roles, password reset, locking / unlocking.
- name: Clearing Institute operations
  description: Get the list of all available connections (acquirers, alternative payment
    methods, 3rd party providers etc).
- name: Division operations
  description: Manage all division entity operations (create, edit, delete, retrieve,
    list etc)
- name: Merchant operations
  description: Manage all merchant entity operations (create, edit, delete, retrieve,
    list etc)
- name: Channel operations
  description: Manage all channel entity operations (create, edit, delete, retrieve,
    list etc)
- name: Merchant Account operations
  description: "Allows configuration of merchant accounts at different levels:\n\n\
    - psps\n- divisions\n- merchants\n- channels\n    \n\nThe configuration may include\
    \ 3D Secure parameters for different brands, or other processing relevant settings\
    \ (CVV and AVS policies, different types of transaction dispatching etc)"
- name: Settings operations
  description: "The configuration settings in BIP UI can be set at different entity\
    \ levels:\n\n- PSP\n- Division\n- Merchant\n- Channel\n    \n\nThe settings follow\
    \ a hierarchy model. If a setting (RIRO) is set at a higher level, then it is\
    \ inherited at the lower levels unless overwritten."
- name: API Token operations
  description: Manage API tokens for merchant access to transaction processing.
